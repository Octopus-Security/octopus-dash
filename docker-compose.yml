services:
  octopus-dash:
    build: .
    container_name: octopus_dash
    restart: unless-stopped
    ports:
      - "${TAILSCALE_IP:-100.92.221.67}:7000:7000"   # tailnet only; host must own this IP
    environment:
      - PORT=7000
      - DEVICE_LABEL=${DEVICE_LABEL:-Hetzner Server}
    # Read-only host mounts so systeminformation can read real metrics
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    pid: host
