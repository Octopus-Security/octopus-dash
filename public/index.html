<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024">
  <title>Octopus Dash</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #9d8ff7;
      --green: #4fd494;
      --yellow: #f0b84e;
      --red: #f06060;
      --tailscale: #7ec8e3;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', monospace;
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      gap: 12px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .device-name {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .device-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .clock-time {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      text-align: right;
    }

    .clock-date {
      font-size: 11px;
      color: var(--muted);
      text-align: right;
      margin-top: 1px;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ── Gauge ── */
    .gauge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .gauge-label {
      width: 60px;
      font-size: 12px;
      color: var(--text);
      flex-shrink: 0;
    }

    .gauge-bar {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .gauge-pct {
      width: 38px;
      text-align: right;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .gauge-sub {
      font-size: 11px;
      color: var(--muted);
      margin-left: 70px;
      margin-top: -3px;
      margin-bottom: 8px;
    }

    .color-low  { background: var(--green); color: var(--green); }
    .color-mid  { background: var(--yellow); color: var(--yellow); }
    .color-high { background: var(--red); color: var(--red); }

    /* ── Network ── */
    .net-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }

    .net-row:last-child { border-bottom: none; }

    .net-iface { font-size: 11px; color: var(--muted); }

    .net-ip { font-size: 15px; font-weight: 700; }

    .ts-badge {
      font-size: 10px;
      background: var(--tailscale)22;
      color: var(--tailscale);
      border: 1px solid var(--tailscale)44;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 6px;
    }

    /* ── Uptime / temp big values ── */
    .big-val {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    .big-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* ── Status dot ── */
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .error { color: var(--red); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="device-name" id="device-name">—</div>
      <div class="device-meta" id="device-meta">loading…</div>
    </div>
    <div>
      <div class="clock-time" id="clock-time">--:--:--</div>
      <div class="clock-date" id="clock-date"></div>
    </div>
  </header>

  <div class="grid" id="grid">
    <div class="card"><div class="card-body"><div class="error">Loading…</div></div></div>
  </div>

  <script>
    function tickClock() {
      const now = new Date();
      document.getElementById('clock-time').textContent =
        now.toLocaleTimeString('en-US', { hour12: false });
      document.getElementById('clock-date').textContent =
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    setInterval(tickClock, 1000);
    tickClock();

    function fmtBytes(b) {
      if (b >= 1e12) return (b / 1e12).toFixed(1) + ' TB';
      if (b >= 1e9)  return (b / 1e9).toFixed(1) + ' GB';
      if (b >= 1e6)  return (b / 1e6).toFixed(0) + ' MB';
      return b + ' B';
    }

    function fmtUptime(secs) {
      const d = Math.floor(secs / 86400);
      const h = Math.floor((secs % 86400) / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const parts = [];
      if (d) parts.push(d + 'd');
      if (h) parts.push(h + 'h');
      parts.push(m + 'm');
      return parts.join(' ');
    }

    function colorClass(pct) {
      if (pct < 60) return 'color-low';
      if (pct < 85) return 'color-mid';
      return 'color-high';
    }

    function gaugeRow(label, pct, sub) {
      const cls = colorClass(pct);
      return `
        <div class="gauge-row">
          <span class="gauge-label">${label}</span>
          <div class="gauge-bar"><div class="gauge-fill ${cls}" style="width:${pct}%"></div></div>
          <span class="gauge-pct ${cls}">${pct}%</span>
        </div>
        ${sub ? `<div class="gauge-sub">${sub}</div>` : ''}
      `;
    }

    function render(d) {
      document.getElementById('device-name').innerHTML = `<span class="dot"></span>${d.label}`;
      document.getElementById('device-meta').textContent =
        `${d.distro || d.platform} · ${d.arch} · ${d.hostname}`;

      const cards = [];

      // CPU
      cards.push(`
        <div class="card">
          <div class="card-title">CPU</div>
          <div class="card-body">
            ${gaugeRow('Usage', d.cpu.load, '')}
            ${d.cpu.cores ? `<div class="gauge-sub" style="margin-left:0;margin-top:4px">${d.cpu.cores} threads${d.cpu.temp != null ? ' · ' + d.cpu.temp + '°C' : ''}</div>` : ''}
          </div>
        </div>
      `);

      // Memory
      cards.push(`
        <div class="card">
          <div class="card-title">Memory</div>
          <div class="card-body">
            ${gaugeRow('RAM', d.mem.pct, `${fmtBytes(d.mem.used)} / ${fmtBytes(d.mem.total)}`)}
          </div>
        </div>
      `);

      // Uptime
      cards.push(`
        <div class="card">
          <div class="card-title">Uptime</div>
          <div class="card-body">
            <div class="big-val">${fmtUptime(d.uptime)}</div>
          </div>
        </div>
      `);

      // Storage
      const diskRows = d.disks.map(disk =>
        gaugeRow(disk.mount, disk.pct, `${fmtBytes(disk.used)} / ${fmtBytes(disk.total)}`)
      ).join('');
      cards.push(`
        <div class="card">
          <div class="card-title">Storage</div>
          <div class="card-body">${diskRows || '<div class="error">No disks</div>'}</div>
        </div>
      `);

      // Network
      const netRows = d.nets.map(n => `
        <div class="net-row">
          <span class="net-iface">${n.iface}</span>
          <span class="net-ip">${n.ip4}${n.tailscale ? '<span class="ts-badge">TS</span>' : ''}</span>
        </div>
      `).join('');
      cards.push(`
        <div class="card">
          <div class="card-title">Network</div>
          <div class="card-body">${netRows || '<div class="error">No interfaces</div>'}</div>
        </div>
      `);

      // Temp or placeholder
      const tempVal = d.cpu.temp != null ? d.cpu.temp + '°C' : '—';
      const tempCls = d.cpu.temp > 75 ? 'color-high' : d.cpu.temp > 60 ? 'color-mid' : 'color-low';
      cards.push(`
        <div class="card">
          <div class="card-title">CPU Temp</div>
          <div class="card-body">
            <div class="big-val ${d.cpu.temp != null ? tempCls : ''}">${tempVal}</div>
            ${d.cpu.temp != null ? `<div class="big-sub">${d.cpu.temp < 60 ? 'Cool' : d.cpu.temp < 75 ? 'Warm' : 'Hot'}</div>` : ''}
          </div>
        </div>
      `);

      document.getElementById('grid').innerHTML = cards.join('');
    }

    async function fetchStats() {
      try {
        const r = await fetch('/api/stats');
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        render(d);
      } catch (e) {
        document.getElementById('grid').innerHTML =
          `<div class="card"><div class="card-body"><div class="error">Error: ${e.message}</div></div></div>`;
      }
    }

    fetchStats();
    setInterval(fetchStats, 3000);
  </script>
</body>
</html>
